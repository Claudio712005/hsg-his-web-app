<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">

    <h:form id="formHistoricoAlergias">

        <h:panelGroup layout="block" styleClass="panel panel-secundario" style="margin-top:20px;">

            <h:panelGroup layout="block" styleClass="panel-title">
                <i class="fa fa-history panel-icon"/>
                <h:outputText value="Histórico Geral de Alergias"/>
            </h:panelGroup>

            <h:panelGroup layout="block" styleClass="panel-body">

                <h:panelGroup layout="block" styleClass="note"
                              style="margin-bottom:12px; background:#f0f0f0; border-color:#d0d0d0; color:#555;">
                    <i class="fa fa-archive"/>
                    <h:outputText value=" Registros já avaliados (aprovados ou rejeitados). Use os filtros para localizar um registro específico."/>
                </h:panelGroup>

                <h:panelGroup layout="block" styleClass="filter-bar">
                    <div class="filter-group">
                        <label class="filter-label" for="filtroHistPaciente">Paciente</label>
                        <h:inputText id="filtroHistPaciente"
                                     value="#{aprovacaoAlergiaBean.filtroHistoricoPaciente}"
                                     styleClass="filter-input"
                                     placeholder="Nome do paciente"/>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label" for="filtroHistTipo">Tipo</label>
                        <h:selectOneMenu id="filtroHistTipo"
                                         value="#{aprovacaoAlergiaBean.filtroHistoricoTipo}"
                                         styleClass="filter-select">
                            <f:selectItem itemLabel="Todos" itemValue=""/>
                            <f:selectItems value="#{aprovacaoAlergiaBean.tiposAlergia}"
                                           var="t"
                                           itemValue="#{t.name()}"
                                           itemLabel="#{t.descricao}"/>
                        </h:selectOneMenu>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label" for="filtroHistGravidade">Gravidade</label>
                        <h:selectOneMenu id="filtroHistGravidade"
                                         value="#{aprovacaoAlergiaBean.filtroHistoricoGravidade}"
                                         styleClass="filter-select">
                            <f:selectItem itemLabel="Todas" itemValue=""/>
                            <f:selectItems value="#{aprovacaoAlergiaBean.gravidadesAlergia}"
                                           var="g"
                                           itemValue="#{g.name()}"
                                           itemLabel="#{g.descricao}"/>
                        </h:selectOneMenu>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label" for="filtroHistStatus">Situação</label>
                        <h:selectOneMenu id="filtroHistStatus"
                                         value="#{aprovacaoAlergiaBean.filtroHistoricoStatus}"
                                         styleClass="filter-select">
                            <f:selectItem itemLabel="Todas" itemValue=""/>
                            <f:selectItems value="#{aprovacaoAlergiaBean.statusHistorico}"
                                           var="s"
                                           itemValue="#{s.name()}"
                                           itemLabel="#{s.descricao}"/>
                        </h:selectOneMenu>
                    </div>
                    <div class="filter-actions">
                        <p:commandButton value="Filtrar"
                                         styleClass="btn primary"
                                         icon="fa fa-search"
                                         actionListener="#{aprovacaoAlergiaBean.aplicarFiltrosHistorico}"
                                         update="tabelaHistorico"
                                         process="filtroHistPaciente filtroHistTipo filtroHistGravidade filtroHistStatus @this"/>
                        <p:commandButton value="Limpar"
                                         styleClass="btn secondary"
                                         icon="fa fa-times"
                                         actionListener="#{aprovacaoAlergiaBean.limparFiltrosHistorico}"
                                         update="filtroHistPaciente filtroHistTipo filtroHistGravidade filtroHistStatus tabelaHistorico"
                                         process="@this"/>
                    </div>
                </h:panelGroup>

                <p:dataTable id="tabelaHistorico"
                             var="hist"
                             value="#{aprovacaoAlergiaBean.historicoModel}"
                             lazy="true"
                             rows="10"
                             paginator="true"
                             paginatorPosition="bottom"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             rowsPerPageTemplate="5,10,25"
                             currentPageReportTemplate="{startRecord}–{endRecord} de {totalRecords}"
                             emptyMessage="Nenhum registro encontrado no histórico."
                             styleClass="lazy-table"
                             tableStyle="width:100%; table-layout:fixed;">

                    <p:column headerText="Paciente" sortBy="#{hist.nomePaciente}" sortField="nomePaciente" style="width:24%;">
                        <h:outputText value="#{hist.nomePaciente}"/>
                    </p:column>

                    <p:column headerText="Alergia" sortBy="#{hist.nomeAlergia}" sortField="nomeAlergia" style="width:20%;">
                        <b><h:outputText value="#{hist.nomeAlergia}"/></b>
                    </p:column>

                    <p:column headerText="Tipo" sortBy="#{hist.tipoDescricao}" sortField="tipoAlergia" style="width:110px;">
                        <h:outputText value="#{hist.tipoDescricao}"/>
                    </p:column>

                    <p:column headerText="Gravidade" sortBy="#{hist.gravidadeDescricao}" sortField="gravidadeAlergia" style="width:120px;" styleClass="center-align">
                        <h:outputText styleClass="chip #{hist.gravidadeCssClass}"
                                      value="#{hist.gravidadeDescricao}"/>
                    </p:column>

                    <p:column headerText="Situação" sortBy="#{hist.statusDescricao}" sortField="statusAlergia" style="width:110px;" styleClass="center-align">
                        <h:outputText styleClass="chip #{hist.statusCssClass}"
                                      value="#{hist.statusDescricao}"/>
                    </p:column>

                    <p:column headerText="Avaliada em" sortBy="#{hist.dataAvaliacao}" sortField="dataUltimaAlteracao" style="width:140px;">
                        <h:outputText value="#{hist.dataAvaliacao}" styleClass="mono"/>
                    </p:column>

                    <p:column headerText="Ações" style="width:60px;" styleClass="center-align">
                        <p:commandButton icon="fa fa-eye"
                                         styleClass="btn icon-btn info"
                                         title="Visualizar"
                                         process="@this"
                                         update=":formHistoricoAlergias:dlgBodyHistoricoAlergia"
                                         oncomplete="PF('wDlgHistoricoAlergia').show()"
                                         actionListener="#{aprovacaoAlergiaBean.prepararVisualizacaoHistorico(hist)}"/>
                    </p:column>

                </p:dataTable>

            </h:panelGroup>
        </h:panelGroup>

        <ui:include src="dialog-historico.xhtml"/>

    </h:form>

</ui:composition>
