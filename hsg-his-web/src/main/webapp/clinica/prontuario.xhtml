<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/clinica/layout.xhtml">

    <ui:define name="title">HSG - Prontuário</ui:define>

    <ui:define name="content">

        <h:form id="formProntuario">

            <p:growl id="msgs" widgetVar="msgs" showDetail="true" life="5000"
                     globalOnly="true" autoUpdate="true"/>

            <h:panelGroup layout="block" styleClass="panel" style="margin-bottom:10px;">
                <h:panelGroup layout="block" styleClass="panel-title">
                    <i class="fa fa-search panel-icon"/>
                    <h:outputText value="Buscar paciente"/>
                </h:panelGroup>
                <h:panelGroup layout="block" styleClass="panel-body">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                        <p:autoComplete value="#{prontuarioBean.idPacienteSelecionado}"
                                        completeMethod="#{prontuarioBean.autocompletarPaciente}"
                                        var="p" itemLabel="#{p.nomeCompleto}" itemValue="#{p.id}"
                                        forceSelection="true" minQueryLength="2" queryDelay="350"
                                        placeholder="Digite ao menos 2 letras do nome..."
                                        style="width:380px;">
                            <p:column>
                                <h:outputText value="#{p.nomeCompleto}" style="font-weight:bold;"/>
                                <h:outputText value=" (ID #{p.id})" style="color:#666;font-size:11px;"/>
                            </p:column>
                        </p:autoComplete>
                        <p:commandButton value="Abrir" icon="fa fa-folder-open"
                                         styleClass="btn primary"
                                         action="#{prontuarioBean.abrirPaciente}"
                                         update="formProntuario:corpo"
                                         process="@form"/>
                    </div>
                </h:panelGroup>
            </h:panelGroup>

            <h:panelGroup id="corpo" layout="block">
                <h:panelGroup rendered="#{prontuarioBean.prontuario == null}" styleClass="note">
                    Selecione um paciente acima para visualizar o prontuário.
                </h:panelGroup>
                <ui:include src="/WEB-INF/templates/fragments/prontuario-corpo.xhtml">
                    <ui:param name="bean" value="#{prontuarioBean}"/>
                    <ui:param name="contexto" value="CLINICO"/>
                </ui:include>
            </h:panelGroup>

        </h:form>

    </ui:define>

</ui:composition>
