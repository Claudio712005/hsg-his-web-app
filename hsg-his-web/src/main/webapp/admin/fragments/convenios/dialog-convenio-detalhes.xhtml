<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">

    <p:dialog id="dlgConvenio"
              widgetVar="wDlgConvenio"
              header="Detalhes do Convênio"
              modal="true"
              resizable="false"
              closeOnEscape="true"
              width="640"
              styleClass="hsg-dialog">

        <h:panelGroup id="dlgBodyConvenio" layout="block">

            <h:panelGroup layout="block" rendered="#{convenioBean.convenioSelecionado == null}">
                <h:panelGroup layout="block" styleClass="note" style="padding:16px 12px;">
                    <h:outputText value="Nenhum convênio selecionado."/>
                </h:panelGroup>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{convenioBean.convenioSelecionado != null}">

                <div class="dlg-section">
                    <div class="dlg-section-title">
                        <i class="fa fa-id-card"/>
                        Identificação
                    </div>
                    <h:panelGroup layout="block" styleClass="kv" style="margin:0;">
                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Nome"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v">
                            <b><h:outputText value="#{convenioBean.convenioSelecionado.nome}"/></b>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Status"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v">
                            <h:outputText styleClass="chip #{convenioBean.convenioSelecionado.status.valor eq 'A' ? 'ativo' : 'inativo'}"
                                          value="#{convenioBean.convenioSelecionado.status.descricao}"/>
                        </h:panelGroup>
                    </h:panelGroup>
                </div>

                <div class="dlg-section">
                    <div class="dlg-section-title">
                        <i class="fa fa-building"/>
                        Dados administrativos
                    </div>
                    <h:panelGroup layout="block" styleClass="kv" style="margin:0;">
                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Registro ANS"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v mono">
                            <h:outputText value="#{convenioBean.convenioSelecionado.registroAns != null ? convenioBean.convenioSelecionado.registroAns : '—'}"/>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="CNPJ"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v mono">
                            <h:outputText value="#{convenioBean.convenioSelecionado.cnpj != null ? convenioBean.convenioSelecionado.cnpj : '—'}"/>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Telefone"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v mono">
                            <h:outputText value="#{convenioBean.convenioSelecionado.telefone != null ? convenioBean.convenioSelecionado.telefone : '—'}"/>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Site"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v mono">
                            <h:outputText value="#{convenioBean.convenioSelecionado.site != null ? convenioBean.convenioSelecionado.site : '—'}"/>
                        </h:panelGroup>
                    </h:panelGroup>
                </div>

                <div class="dlg-section">
                    <div class="dlg-section-title">
                        <i class="fa fa-align-left"/>
                        Descrição
                    </div>
                    <h:panelGroup layout="block" styleClass="kv" style="margin:0;">
                        <h:panelGroup layout="block" styleClass="v">
                            <h:outputText value="#{convenioBean.convenioSelecionado.descricao != null ? convenioBean.convenioSelecionado.descricao : '—'}"/>
                        </h:panelGroup>
                    </h:panelGroup>
                </div>

                <div class="dlg-section">
                    <div class="dlg-section-title">
                        <i class="fa fa-calendar-alt"/>
                        Registro
                    </div>
                    <h:panelGroup layout="block" styleClass="kv" style="margin:0;">
                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Cadastrado em"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v mono">
                            <h:outputText value="#{convenioBean.formatarData(convenioBean.convenioSelecionado.dataCadastro)}"/>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Última atualização"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v mono">
                            <h:outputText value="#{convenioBean.formatarData(convenioBean.convenioSelecionado.dataUltimaAtualizacao)}"/>
                        </h:panelGroup>
                    </h:panelGroup>
                </div>

            </h:panelGroup>
        </h:panelGroup>

        <f:facet name="footer">
            <p:commandButton value="Fechar"
                             icon="fa fa-times"
                             type="button"
                             onclick="PF('wDlgConvenio').hide();"
                             styleClass="btn secondary"/>
        </f:facet>

    </p:dialog>

</ui:composition>
