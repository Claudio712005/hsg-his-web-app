<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">

    <h:form id="formEspecialidades">

        <div class="prof-section-header">
            <i class="fa fa-stethoscope prof-section-icon"/>
            <span>Especialidades</span>
        </div>

        <h:panelGroup layout="block" styleClass="filter-bar">
            <div class="filter-group">
                <label class="filter-label" for="filtroNomeEsp">Nome da especialidade</label>
                <h:inputText id="filtroNomeEsp"
                             value="#{adminBean.filtroNomeEspecialidade}"
                             styleClass="filter-input"
                             placeholder="Ex.: Cardiologia"/>
            </div>
            <div class="filter-group">
                <label class="filter-label" for="filtroAreaEsp">Área</label>
                <h:selectOneMenu id="filtroAreaEsp"
                                 value="#{adminBean.filtroAreaEspecialidade}"
                                 styleClass="filter-select">
                    <f:selectItem itemLabel="Todas" itemValue=""/>
                    <f:selectItem itemLabel="Clínica"    itemValue="CLINICA"/>
                    <f:selectItem itemLabel="Cirurgia"   itemValue="CIRURGIA"/>
                    <f:selectItem itemLabel="Diagnóstico" itemValue="DIAGNOSTICO"/>
                </h:selectOneMenu>
            </div>
            <div class="filter-group">
                <label class="filter-label" for="filtroStatusEsp">Status</label>
                <h:selectOneMenu id="filtroStatusEsp"
                                 value="#{adminBean.filtroStatusEspecialidade}"
                                 styleClass="filter-select">
                    <f:selectItem itemLabel="Todos"  itemValue=""/>
                    <f:selectItem itemLabel="Ativo"   itemValue="A"/>
                    <f:selectItem itemLabel="Inativo" itemValue="I"/>
                </h:selectOneMenu>
            </div>
            <div class="filter-actions">
                <p:commandButton value="Filtrar"
                                 styleClass="btn primary"
                                 actionListener="#{adminBean.aplicarFiltrosEspecialidade}"
                                 update="tabelaEspecialidades"
                                 process="filtroNomeEsp filtroAreaEsp filtroStatusEsp @this"
                                 icon="fa fa-search"/>
                <p:commandButton value="Limpar"
                                 styleClass="btn secondary"
                                 actionListener="#{adminBean.limparFiltrosEspecialidade}"
                                 update="filtroNomeEsp filtroAreaEsp filtroStatusEsp tabelaEspecialidades"
                                 process="@this"
                                 icon="fa fa-times"/>
            </div>
        </h:panelGroup>

        <p:dataTable id="tabelaEspecialidades"
                     value="#{adminBean.especialidadeModel}"
                     var="esp"
                     lazy="true"
                     rows="5"
                     paginator="true"
                     paginatorPosition="bottom"
                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                     rowsPerPageTemplate="5,10,25"
                     currentPageReportTemplate="{startRecord}–{endRecord} de {totalRecords}"
                     emptyMessage="Nenhuma especialidade encontrada."
                     styleClass="lazy-table"
                     tableStyle="width:100%; table-layout:fixed;">

            <p:column headerText="Nome" sortBy="#{esp.nome}" sortField="nome"
                      style="width:35%;">
                <h:outputText value="#{esp.nome}"/>
            </p:column>

            <p:column headerText="Área" sortBy="#{esp.area}" sortField="area"
                      style="width:20%;">
                <h:outputText value="#{adminBean.formatarArea(esp.area)}"/>
            </p:column>

            <p:column headerText="Status" sortBy="#{esp.status}" sortField="status"
                      style="width:80px;" styleClass="center-align">
                <h:outputText styleClass="chip #{esp.status.valor eq 'A' ? 'ativo' : 'inativo'}"
                              value="#{esp.status.descricao}"/>
            </p:column>

            <p:column headerText="Cadastrado em" sortBy="#{esp.dataCadastro}" sortField="dataCadastro"
                      style="width:115px;">
                <h:outputText value="#{adminBean.formatarData(esp.dataCadastro)}"/>
            </p:column>

            <p:column headerText="Ações" style="width:60px;" styleClass="center-align">
                <p:commandButton icon="fa fa-eye"
                                 styleClass="btn icon-btn info"
                                 title="Ver detalhes"
                                 update=":tabViewClinica:formEspecialidades:dlgBodyEspecialidade"
                                 oncomplete="PF('wDlgEspecialidade').show()"
                                 process="@this">
                    <f:setPropertyActionListener target="#{adminBean.especialidadeSelecionada}" value="#{esp}"/>
                </p:commandButton>
            </p:column>

        </p:dataTable>

        <ui:include src="dialog-especialidade.xhtml"/>

    </h:form>

</ui:composition>
