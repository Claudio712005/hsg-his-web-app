<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">

    <p:dialog id="dlgEnfermeiro"
              widgetVar="wDlgEnfermeiro"
              header="Detalhes do Enfermeiro"
              modal="true"
              resizable="false"
              closeOnEscape="true"
              width="680"
              styleClass="hsg-dialog">

        <h:panelGroup id="dlgBodyEnfermeiro" layout="block">

            <h:panelGroup layout="block" rendered="#{adminBean.enfermeiroSelecionado == null}">
                <h:panelGroup layout="block" styleClass="note" style="padding:16px 12px;">
                    <h:outputText value="Nenhum enfermeiro selecionado."/>
                </h:panelGroup>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{adminBean.enfermeiroSelecionado != null}">

                <div class="dlg-section">
                    <div class="dlg-section-title">
                        <i class="fa fa-procedures"/>
                        Identificação
                    </div>
                    <h:panelGroup layout="block" styleClass="kv" style="margin:0;">
                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Nome completo"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v">
                            <b><h:outputText value="#{adminBean.enfermeiroSelecionado.nomeCompleto}"/></b>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="COREN"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v mono">
                            <h:outputText value="#{adminBean.enfermeiroSelecionado.coren != null ? adminBean.enfermeiroSelecionado.coren.formatado : '—'}"/>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Categoria"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v">
                            <h:outputText value="#{adminBean.enfermeiroSelecionado.coren != null and adminBean.enfermeiroSelecionado.coren.categoria != null ? adminBean.enfermeiroSelecionado.coren.categoria.name() : '—'}"/>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Setor"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v">
                            <h:outputText value="#{adminBean.enfermeiroSelecionado.setor != null ? adminBean.enfermeiroSelecionado.setor : '—'}"/>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Especialidade"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v">
                            <h:outputText value="#{adminBean.enfermeiroSelecionado.especialidade != null ? adminBean.enfermeiroSelecionado.especialidade : '—'}"/>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Status"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v">
                            <h:outputText styleClass="chip #{adminBean.enfermeiroSelecionado.status.valor eq 'A' ? 'ativo' : (adminBean.enfermeiroSelecionado.status.valor eq 'I' ? 'inativo' : 'pendente')}"
                                          value="#{adminBean.enfermeiroSelecionado.status.descricao}"/>
                        </h:panelGroup>
                    </h:panelGroup>
                </div>

                <div class="dlg-section">
                    <div class="dlg-section-title">
                        <i class="fa fa-address-book"/>
                        Contato
                    </div>
                    <h:panelGroup layout="block" styleClass="kv" style="margin:0;">
                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="E-mail"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v mono">
                            <h:outputText value="#{adminBean.enfermeiroSelecionado.email != null ? adminBean.enfermeiroSelecionado.email : '—'}"/>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Telefone"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v mono">
                            <h:outputText value="#{adminBean.enfermeiroSelecionado.telefone != null ? adminBean.enfermeiroSelecionado.telefone : '—'}"/>
                        </h:panelGroup>
                    </h:panelGroup>
                </div>

                <div class="dlg-section">
                    <div class="dlg-section-title">
                        <i class="fa fa-calendar-alt"/>
                        Registro
                    </div>
                    <h:panelGroup layout="block" styleClass="kv" style="margin:0;">
                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Data de nascimento"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v mono">
                            <h:outputText value="#{adminBean.formatarDataNasc(adminBean.enfermeiroSelecionado.dataNascimento)}"/>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Cadastrado em"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v mono">
                            <h:outputText value="#{adminBean.formatarData(adminBean.enfermeiroSelecionado.dataCadastro)}"/>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Última atualização"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v mono">
                            <h:outputText value="#{adminBean.formatarData(adminBean.enfermeiroSelecionado.dataUltimaAtualizacao)}"/>
                        </h:panelGroup>

                        <h:panelGroup layout="block" styleClass="k"><h:outputText value="Usuário do sistema"/></h:panelGroup>
                        <h:panelGroup layout="block" styleClass="v mono">
                            <h:outputText value="#{adminBean.enfermeiroSelecionado.contaUsuario != null ? adminBean.enfermeiroSelecionado.contaUsuario.username : '—'}"/>
                        </h:panelGroup>
                    </h:panelGroup>
                </div>

            </h:panelGroup>
        </h:panelGroup>

        <f:facet name="footer">
            <p:commandButton value="Fechar"
                             icon="fa fa-times"
                             type="button"
                             onclick="PF('wDlgEnfermeiro').hide();"
                             styleClass="btn secondary"/>
        </f:facet>

    </p:dialog>

</ui:composition>
