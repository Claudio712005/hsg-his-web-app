<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="http://java.sun.com/jsf/composite"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets">

<cc:interface>
    <cc:attribute name="bean" required="true"/>
</cc:interface>

<cc:implementation>
    <h:panelGroup layout="block" styleClass="panel">
        <h:panelGroup layout="block" styleClass="panel-title">
            <i class="fa fa-id-card panel-icon"/>
            <h:outputText value="Meu Convênio"/>
        </h:panelGroup>

        <h:panelGroup layout="block" styleClass="panel-body">

            <h:panelGroup layout="block" rendered="#{not cc.attrs.bean.possuiConvenio}">
                <h:panelGroup layout="block" styleClass="note">
                    <i class="fa fa-circle-info" style="margin-right:6px;"/>
                    <h:outputText value="Você não possui convênio ativo. Adira a um plano para registrar sua carteirinha no hospital."/>
                </h:panelGroup>
                <h:panelGroup layout="block" style="margin-top:12px;">
                    <h:outputLink value="#{request.contextPath}/paciente/meu-convenio.xhtml" styleClass="btn primary">
                        <i class="fa fa-plus" style="margin-right:6px;"/>
                        <h:outputText value="Aderir a um convênio"/>
                    </h:outputLink>
                </h:panelGroup>
            </h:panelGroup>

            <h:panelGroup layout="block" rendered="#{cc.attrs.bean.possuiConvenio}">

                <h:panelGroup layout="block"
                              style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                    <h:panelGroup layout="block"
                                  style="width:42px; height:42px; border-radius:10px; background:#e3f2fd; display:flex; align-items:center; justify-content:center; flex:0 0 auto;">
                        <i class="fa fa-hospital-user" style="font-size:20px; color:#1565c0;"/>
                    </h:panelGroup>
                    <h:panelGroup layout="block" style="min-width:0;">
                        <div style="font-size:15px; font-weight:700; word-break:break-word;">
                            <h:outputText value="#{cc.attrs.bean.convenioAtivo.plano.convenio.nome}"/>
                        </div>
                        <div style="color:#666; font-size:13px;">
                            <h:outputText value="#{cc.attrs.bean.convenioAtivo.plano.nome} &#183; #{cc.attrs.bean.convenioAtivo.plano.tipoCobertura.descricao}"/>
                        </div>
                    </h:panelGroup>
                    <h:panelGroup layout="block" style="margin-left:auto;">
                        <h:outputText styleClass="chip ativo" value="Ativo"/>
                    </h:panelGroup>
                </h:panelGroup>

                <h:panelGroup layout="block" styleClass="kv">
                    <h:panelGroup layout="block" styleClass="k"><h:outputText value="Carteirinha"/></h:panelGroup>
                    <h:panelGroup layout="block" styleClass="v mono">
                        <h:outputText value="#{cc.attrs.bean.convenioAtivo.carteirinhaMascara}"/>
                    </h:panelGroup>

                    <h:panelGroup layout="block" styleClass="k"><h:outputText value="Validade"/></h:panelGroup>
                    <h:panelGroup layout="block" styleClass="v mono">
                        <h:outputText value="#{cc.attrs.bean.convenioValidadeFormatada}"/>
                    </h:panelGroup>

                    <h:panelGroup layout="block" styleClass="k"><h:outputText value="Acomodação"/></h:panelGroup>
                    <h:panelGroup layout="block" styleClass="v">
                        <h:outputText value="#{cc.attrs.bean.convenioAtivo.plano.acomodacaoIndividual ? 'Individual' : 'Enfermaria'}"/>
                    </h:panelGroup>
                </h:panelGroup>

                <h:panelGroup layout="block" style="margin-top:14px;">
                    <h:outputLink value="#{request.contextPath}/paciente/meu-convenio.xhtml" styleClass="btn secondary">
                        <i class="fa fa-arrow-right" style="margin-right:6px;"/>
                        <h:outputText value="Gerenciar convênio"/>
                    </h:outputLink>
                </h:panelGroup>

            </h:panelGroup>

        </h:panelGroup>
    </h:panelGroup>
</cc:implementation>
</html>
