name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    name: hsg-his-domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Test domain
        run: ./mvnw -B -ntp -pl hsg-his-domain test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-domain
          path: hsg-his-domain/target/surefire-reports/

  service:
    name: hsg-his-service
    runs-on: ubuntu-latest
    needs: domain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Test service
        run: ./mvnw -B -ntp -pl hsg-his-service -am test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-service
          path: hsg-his-service/target/surefire-reports/

  web:
    name: hsg-his-web
    runs-on: ubuntu-latest
    needs: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Test web
        run: ./mvnw -B -ntp -pl hsg-his-web -am test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-web
          path: hsg-his-web/target/surefire-reports/

  ear:
    name: hsg-his-ear
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Package ear
        run: ./mvnw -B -ntp -pl hsg-his-ear -am package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: hsg-his-ear
          path: hsg-his-ear/target/*.ear
